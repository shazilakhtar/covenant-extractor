# Streamlit theme. Safe to commit: it holds colours only, never secrets.
# (The API key lives in .streamlit/secrets.toml, which stays out of git.)
[theme]
base = "light"
primaryColor = "#1F5C4A"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#E9EDF2"
textColor = "#0F1720"
font = "sans serif"
